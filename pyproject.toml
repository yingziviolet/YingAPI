[project]
name = "llm-gateway"
version = "0.1.0"
description = "自研 LLM 网关:OpenAI 兼容数据面 + 管理控制面(P1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
